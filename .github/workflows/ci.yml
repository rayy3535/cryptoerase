name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.22", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: make fmt-check
      - name: vet
        run: make vet
      - name: test
        run: make test
      - name: build (linux amd64 + arm64, static)
        run: make release
      - uses: actions/upload-artifact@v4
        if: matrix.go == 'stable'
        with:
          name: cryptoerase-linux
          path: dist/
