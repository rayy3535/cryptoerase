name: release

# Publishes static linux/amd64 and linux/arm64 binaries, SHA256SUMS and SLSA
# build provenance as a GitHub release. It runs when
#   - a commit on main sets cryptoerase.Version to a version that has no tag
#     yet: the release and its tag vX.Y.Z are created on that commit; or
#   - a tag vX.Y.Z is pushed, or a release with a new tag is published in the
#     web UI.
# The version, the tag and a "## vX.Y.Z (date)" section in CHANGELOG.md must
# agree. A version with a "-" (1.2.0-rc.1) is published as a pre-release.
on:
  push:
    branches: [main]
    paths: [options.go, CHANGELOG.md] # not applied to tag pushes
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub release
      id-token: write # Sigstore signing for the attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide whether to release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(sed -n 's/^const Version = "\(.*\)"$/\1/p' options.go)"
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
              echo "$tag already exists; nothing to release."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "Releasing $tag"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "release=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.plan.outputs.release == 'true'
        with:
          go-version-file: go.mod
          cache: false # release builds start from a clean cache
      - name: Check tag, version constant and changelog agree
        if: steps.plan.outputs.release == 'true'
        # Notes go to $RUNNER_TEMP: an untracked file in the checkout would
        # make the binaries report a "-dirty" build.
        run: |
          version="${TAG#v}"
          const="$(sed -n 's/^const Version = "\(.*\)"$/\1/p' options.go)"
          if [ "$version" != "$const" ]; then
            echo "::error::tag $TAG does not match cryptoerase.Version $const"; exit 1
          fi
          awk -v h="## $TAG" '$0 == h || index($0, h " ") == 1 {f=1; next} /^## /{f=0} f' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no '## $TAG' section"; exit 1
          fi
          if head -n 50 CHANGELOG.md | grep -q "^## $TAG .*unreleased"; then
            echo "::error::CHANGELOG.md still marks $TAG as unreleased"; exit 1
          fi
          cat "$RUNNER_TEMP/notes.md"
      - name: Lint and test
        if: steps.plan.outputs.release == 'true'
        run: make lint test
      - name: Build
        if: steps.plan.outputs.release == 'true'
        run: |
          make release
          v="$(./dist/cryptoerase-linux-amd64 --version)"
          echo "$v"
          case "$v" in
            "cryptoerase ${TAG#v} ("*-dirty*) echo "::error::release built from a modified tree"; exit 1 ;;
            "cryptoerase ${TAG#v} ("*) ;;
            *) echo "::error::unexpected version output"; exit 1 ;;
          esac
      - name: Attest build provenance
        if: steps.plan.outputs.release == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/cryptoerase-linux-*
      - name: Publish release
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          {
            cat "$RUNNER_TEMP/notes.md"
            echo
            echo '### Verify'
            echo
            echo '```sh'
            echo "sha256sum -c SHA256SUMS --ignore-missing"
            echo "gh attestation verify cryptoerase-linux-amd64 --repo ${GITHUB_REPOSITORY}"
            echo '```'
          } > "$RUNNER_TEMP/body.md"
          title="cryptoerase $TAG"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # The release was created in the web UI, which also created the
            # tag that started this run: attach the binaries and notes to it.
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$title" --notes-file "$RUNNER_TEMP/body.md" "${flags[@]}"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --notes-file "$RUNNER_TEMP/body.md" \
              --verify-tag "${flags[@]}"
          else
            # Creates the tag on the commit that was pushed to main.
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes-file "$RUNNER_TEMP/body.md" "${flags[@]}"
          fi
