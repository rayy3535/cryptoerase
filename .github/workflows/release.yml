name: release

# Push a tag vX.Y.Z (matching cryptoerase.Version and a "## vX.Y.Z" section in
# CHANGELOG.md) to publish static linux/amd64 and linux/arm64 binaries,
# SHA256SUMS, and SLSA build provenance.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub release
      id-token: write # Sigstore signing for the attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # release builds start from a clean cache
      - name: Check tag, version constant and changelog agree
        run: |
          version="${GITHUB_REF_NAME#v}"
          const="$(sed -n 's/^const Version = "\(.*\)"$/\1/p' options.go)"
          if [ "$version" != "$const" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match cryptoerase.Version $const"; exit 1
          fi
          awk -v h="## $GITHUB_REF_NAME" '$0 == h || index($0, h " ") == 1 {f=1; next} /^## /{f=0} f' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no '## $GITHUB_REF_NAME' section"; exit 1
          fi
          if head -n 50 CHANGELOG.md | grep -q "^## $GITHUB_REF_NAME .*unreleased"; then
            echo "::error::CHANGELOG.md still marks $GITHUB_REF_NAME as unreleased"; exit 1
          fi
          cat notes.md
      - name: Lint and test
        run: make lint test
      - name: Build
        run: |
          make release
          ./dist/cryptoerase-linux-amd64 --version | tee /dev/stderr | grep -q "^cryptoerase ${GITHUB_REF_NAME#v} "
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/cryptoerase-linux-*
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          {
            cat notes.md
            echo
            echo '### Verify'
            echo
            echo '```sh'
            echo "sha256sum -c SHA256SUMS --ignore-missing"
            echo "gh attestation verify cryptoerase-linux-amd64 --repo ${GITHUB_REPOSITORY}"
            echo '```'
          } > body.md
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "cryptoerase $GITHUB_REF_NAME" \
            --notes-file body.md \
            --verify-tag "${flags[@]}"
